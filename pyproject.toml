[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "severus-ai"
dynamic = ["version"]
description = "Screen-reader-friendly local Whisper dictation app for Windows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6==6.11.0",
  "faster-whisper==1.2.1",
  "sounddevice==0.5.5",
  "numpy==2.4.4",
  "pynput==1.8.1",
  "pyperclip==1.11.0",
  "pycaw==20251023",
  "comtypes==1.4.16",
]

[project.scripts]
severus-ai = "SeverusAI.app:run"

[tool.setuptools]
packages = ["SeverusAI"]

[tool.setuptools.package-data]
SeverusAI = ["*.wav", "*.mp3"]

[tool.setuptools.dynamic]
version = {attr = "SeverusAI.constants.APP_VERSION"}
