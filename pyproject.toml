[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "severus-ai"
version = "0.1.0"
description = "Screen-reader-friendly local Whisper dictation app for Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7.0",
  "faster-whisper>=1.0.3",
  "sounddevice>=0.4.7",
  "numpy>=1.26.0",
  "pynput>=1.7.7",
  "pyperclip>=1.9.0",
  "pycaw>=20240210",
  "comtypes>=1.4.5",
]

[project.scripts]
severus-ai = "SeverusAI.app:run"

[tool.setuptools]
packages = ["SeverusAI"]
