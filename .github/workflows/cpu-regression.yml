name: Windows CPU regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      SPEAK_TO_BRIDGE_WSL_DISTRO: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.8'
      - name: Install locked CPU dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt -r build-requirements.lock.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Build standard package
        shell: pwsh
        run: ./build.ps1
      - name: Transcribe with bundled Python and generic CPU instructions
        shell: pwsh
        run: |
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $env:CT2_FORCE_CPU_ISA = 'GENERIC'
          $env:QT_QPA_PLATFORM = ''
          $wav = Join-Path $PWD 'tests\assets\verification-speech.wav'
          $output = Join-Path $PWD 'cpu-package-check.json'
          $process = Start-Process '.\dist\SpeakToBridge\SpeakToBridge.exe' -ArgumentList @('--check-hardware','--cpu','--model','tiny','--wav',('"'+$wav+'"'),'--output',('"'+$output+'"')) -WindowStyle Hidden -Wait -PassThru
          $result = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or $result.actual_backend -ne 'CPU (INT8)' -or $result.transcript -notmatch 'quick brown fox') { throw 'Frozen CPU transcription failed' }
          $result | ConvertTo-Json -Depth 5

      - name: Audit pinned runtime dependencies
        shell: pwsh
        run: |
          python -m venv .audit-env
          & .\.audit-env\Scripts\python.exe -m pip install pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { throw 'Audit tool installation failed' }
          foreach ($lock in @('requirements.lock.txt','requirements-amd.lock.txt','requirements-cuda.lock.txt')) {
            & .\.audit-env\Scripts\python.exe -m pip_audit -r $lock --no-deps --disable-pip
            if ($LASTEXITCODE -ne 0) { throw ('Dependency audit failed: '+$lock) }
          }
          Set-Content -LiteralPath .audit-env\torch-version.txt -Value 'torch==2.14.0'
          & .\.audit-env\Scripts\python.exe -m pip_audit -r .audit-env\torch-version.txt --no-deps --disable-pip
          if ($LASTEXITCODE -ne 0) { throw 'Upstream PyTorch advisory check failed' }